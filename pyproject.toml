[tool.ruff]
line-length = 99
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "C", "RUF022"]

[tool.ruff.lint.isort]
section-order = [
    "future",
    "standard-library",
    "third-party",
    "nextgisweb-env-lib",
    "nextgisweb-comp",
    "first-party",
    "local-folder",
]

[tool.ruff.lint.isort.sections]
"nextgisweb-env-lib" = ["nextgisweb.env", "nextgisweb.lib"]
"nextgisweb-comp" = ["nextgisweb"]
